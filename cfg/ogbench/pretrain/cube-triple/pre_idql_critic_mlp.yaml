defaults:
  - _self_
hydra:
  run:
    dir: ${logdir}
_target_: agent.pretrain.train_idql_critic_agent.TrainIDQLCriticPretrainAgent

name: ${env_name}_idql_critic_pretrain_mlp_ta${horizon_steps}
logdir: ${oc.env:DPPO_LOG_DIR}/ogbench-pretrain/${name}/${now:%Y-%m-%d}_${now:%H-%M-%S}_${seed}
train_dataset_path: ${oc.env:DPPO_DATA_DIR}/ogbench/cube-triple/train.npz
base_policy_path: ${oc.env:DPPO_LOG_DIR}/ogbench-pretrain/cube-triple_pre_diffusion_mlp_ta8_td20/REPLACE_WITH_TIMESTAMP/checkpoint/state_3000.pt

seed: 42
device: cuda:0
env_name: cube-triple
obs_dim: 46
action_dim: 5
denoising_steps: 20
cond_steps: 1
horizon_steps: 8
act_steps: 8

wandb:
  entity: ${oc.env:DPPO_WANDB_ENTITY}
  project: ogbench-${env_name}-idql-critic-pretrain
  run: ${now:%H-%M-%S}_${name}

train:
  n_epochs: 999999
  batch_size: 1000
  gamma: 0.999
  critic_lr: 1e-3
  critic_weight_decay: 0
  critic_lr_scheduler:
    first_cycle_steps: 1000
    warmup_steps: 10
    min_lr: 1e-4
  save_model_freq: 100
  log_freq: 1
  critic_tau: 0.001

model:
  _target_: model.diffusion.diffusion_idql.IDQLDiffusion
  min_sampling_denoising_std: 0.1
  randn_clip_value: 3
  network_path: ${base_policy_path}
  actor:
    _target_: model.diffusion.mlp_diffusion.DiffusionMLP
    time_dim: 16
    mlp_dims: [512, 512, 512]
    residual_style: True
    cond_dim: ${eval:'${obs_dim} * ${cond_steps}'}
    horizon_steps: ${horizon_steps}
    action_dim: ${action_dim}
  critic_q:
    _target_: model.common.critic.CriticObsAct
    action_dim: ${action_dim}
    action_steps: ${act_steps}
    cond_dim: ${eval:'${obs_dim} * ${cond_steps}'}
    mlp_dims: [256, 256, 256]
    activation_type: Mish
    residual_style: True
  critic_v:
    _target_: model.common.critic.CriticObs
    cond_dim: ${eval:'${obs_dim} * ${cond_steps}'}
    mlp_dims: [256, 256, 256]
    activation_type: Mish
    residual_style: True
  horizon_steps: ${horizon_steps}
  obs_dim: ${obs_dim}
  action_dim: ${action_dim}
  denoising_steps: ${denoising_steps}
  device: ${device}

train_dataset:
  _target_: agent.dataset.sequence.StitchedSequenceQLearningDataset
  dataset_path: ${train_dataset_path}
  horizon_steps: ${horizon_steps}
  cond_steps: ${cond_steps}
  device: ${device}
  discount_factor: ${train.gamma}
  get_mc_return: False
  reward_mode: end
