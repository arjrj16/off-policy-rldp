defaults:
  - _self_
hydra:
  run:
    dir: ${logdir}
_target_: agent.pretrain.train_idql_critic_agent.TrainIDQLCriticPretrainAgent

name: ${env}_idql_critic_mlp_ta${horizon_steps}
logdir: ${oc.env:DPPO_LOG_DIR}/ogbench-pretrain/${name}/${now:%Y-%m-%d}_${now:%H-%M-%S}_${seed}
# Rewards/masks in train.npz are task-specific (relabeled for cube-single-play-singletask-task1-v0);
# the resulting critics belong to that task only.
train_dataset_path: ${oc.env:DPPO_DATA_DIR}/ogbench/cube-single/train.npz

seed: 42
device: cuda:0
env: cube-single
obs_dim: 28
action_dim: 5
denoising_steps: 20
cond_steps: 1
horizon_steps: 8
act_steps: 8

wandb:
  entity: ${oc.env:DPPO_WANDB_ENTITY}
  project: ogbench-${env}-critic-pretrain
  run: ${now:%H-%M-%S}_${name}

train:
  n_epochs: 500
  batch_size: 1000
  # gamma applied once per 8-step action chunk, matching the fine-tuner's MDP
  gamma: 0.999
  critic_lr: 1e-3
  critic_weight_decay: 0
  critic_lr_scheduler:
    first_cycle_steps: 500
    warmup_steps: 10
    min_lr: 1e-4
  critic_tau: 0.001
  save_model_freq: 50
  log_freq: 1

model:
  _target_: model.diffusion.diffusion_idql.IDQLDiffusion
  min_sampling_denoising_std: 0.1
  randn_clip_value: 3
  final_action_clip_value: 1.0
  # Same tau as fine-tuning so the pretrained V is the same expectile
  expectile: 0.7
  # The actor is instantiated (IDQLDiffusion requires one) but never trained
  # or sampled here — IQL critic training uses only dataset actions — so no
  # BC checkpoint is needed and this stage can run in parallel with BC
  # actor pretraining.
  network_path: null
  actor:
    _target_: model.diffusion.mlp_diffusion.DiffusionMLP
    time_dim: 16
    mlp_dims: [512, 512, 512]
    residual_style: True
    cond_dim: ${eval:'${obs_dim} * ${cond_steps}'}
    horizon_steps: ${horizon_steps}
    action_dim: ${action_dim}
  critic_q:
    _target_: model.common.critic.CriticObsAct
    action_dim: ${action_dim}
    action_steps: ${act_steps}
    cond_dim: ${eval:'${obs_dim} * ${cond_steps}'}
    mlp_dims: [256, 256, 256]
    activation_type: Mish
    residual_style: True
  critic_v:
    _target_: model.common.critic.CriticObs
    cond_dim: ${eval:'${obs_dim} * ${cond_steps}'}
    mlp_dims: [256, 256, 256]
    activation_type: Mish
    residual_style: True
  horizon_steps: ${horizon_steps}
  obs_dim: ${obs_dim}
  action_dim: ${action_dim}
  denoising_steps: ${denoising_steps}
  device: ${device}

train_dataset:
  _target_: agent.dataset.sequence.StitchedChunkQLearningDataset
  dataset_path: ${train_dataset_path}
  horizon_steps: ${horizon_steps}
  cond_steps: ${cond_steps}
  device: ${device}
  # keep equal to the fine-tuner's train.scale_reward_factor
  scale_reward_factor: 1.0
