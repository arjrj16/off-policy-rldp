defaults:
  - _self_
hydra:
  run:
    dir: ${logdir}
_target_: agent.finetune.train_idql_diffusion_agent.TrainIDQLDiffusionAgent

name: ${env_name}_idql_diffusion_mlp_ta${horizon_steps}_td${denoising_steps}
logdir: ${oc.env:DPPO_LOG_DIR}/ogbench-finetune/${name}/${now:%Y-%m-%d}_${now:%H-%M-%S}_${seed}
# Fill in after running cfg/ogbench/pretrain/cube-double/pre_diffusion_mlp.yaml
base_policy_path: /home/melwani/67920/code2/off-policy-rldp-ogbench/log/ogbench-pretrain/cube-double_pre_diffusion_mlp_ta8_td20/2026-06-12_20-11-21_42/checkpoint/state_1300.pt # ${oc.env:DPPO_LOG_DIR}/ogbench-pretrain/cube-double_pre_diffusion_mlp_ta8_td20/REPLACE_WITH_TIMESTAMP/checkpoint/state_3000.pt
normalization_path: ${oc.env:DPPO_DATA_DIR}/ogbench/cube-double/normalization.npz

seed: 42
device: cuda:0
# task2 is OGBench's default/representative task for cube envs
env_name: cube-double-play-singletask-task2-v0
obs_dim: 37
action_dim: 5
denoising_steps: 20
cond_steps: 1
horizon_steps: 8
act_steps: 8

env:
  n_envs: 50
  name: ${env_name}
  env_type: ogbench
  # legacy reward-threshold metric; success_rate is computed from
  # info["success"] for OGBench (rewards are -2..0, threshold unreachable)
  best_reward_threshold_for_success: 1
  # equals OGBench's registered TimeLimit for cube-double
  max_episode_steps: 500
  save_video: True
  wrappers:
    ogbench_lowdim:
      normalization_path: ${normalization_path}
    multi_step:
      n_obs_steps: ${cond_steps}
      n_action_steps: ${act_steps}
      max_episode_steps: ${env.max_episode_steps}
      reset_within_step: True

wandb:
  entity: ${oc.env:DPPO_WANDB_ENTITY}
  project: ogbench-cube-double-finetune
  run: ${now:%H-%M-%S}_${name}

train:
  n_train_itr: 2201
  n_critic_warmup_itr: 35
  # BC warm-up arm switches: explicit here so each experiment arm is a plain
  # CLI override. When turning on, consider also raising n_critic_warmup_itr
  # to bc_warmup_iters + 5 (robomimic transport recipe) so the actor does not
  # train on warmup data while the frozen BC actor is still collecting.
  use_bc_warmup: True
  bc_warmup_iters: 30
  # 500-step episodes = 63 chunks of 8; 126 steps = 2 episodes per env per itr
  n_steps: 126
  gamma: 0.999
  actor_lr: 1e-5
  actor_weight_decay: 0
  actor_lr_scheduler:
    first_cycle_steps: 1000
    warmup_steps: 10
    min_lr: 1e-5
  critic_lr: 1e-3
  critic_weight_decay: 0
  critic_lr_scheduler:
    first_cycle_steps: 1000
    warmup_steps: 10
    min_lr: 1e-3
  save_model_freq: 100
  val_freq: 10
  render:
    freq: 50
    # set > 0 together with env.save_video=True to record and upload videos
    # of the first `num` envs to wandb every `freq` iterations
    num: 1
  scale_reward_factor: 1
  eval_deterministic: True
  eval_sample_num: 10
  critic_tau: 0.001
  use_expectile_exploration: True
  buffer_size: 5000
  replay_ratio: 128
  batch_size: 1000
  diagnostic:
    enabled: true
    env_idx: 0
    bc_num_samples: 8

model:
  _target_: model.diffusion.diffusion_idql.IDQLDiffusion
  min_sampling_denoising_std: 0.1
  randn_clip_value: 3
  # Clip final sampled actions to the normalized action range so the replay
  # buffer stores what the env actually receives.
  final_action_clip_value: 1.0
  # Single expectile tau, used for BOTH the V expectile loss and the
  # implicit-policy sampling weights (IDQL paper uses one parameter).
  expectile: 0.7
  network_path: ${base_policy_path}
  # Optional pretrained Q/V critics from
  # agent.pretrain.train_idql_critic_agent (pre_idql_critic_mlp.yaml).
  # null = randomly initialized critics (online-only IDQL); set to a critic
  # checkpoint for the offline-IDQL-pretrained arm.
  critic_path: /home/melwani/67920/code2/off-policy-rldp-ogbench/log/ogbench-pretrain/cube-double_idql_critic_mlp_ta8/2026-06-13_05-12-21_42/checkpoint/state_250.pt
  actor:
    _target_: model.diffusion.mlp_diffusion.DiffusionMLP
    time_dim: 16
    mlp_dims: [512, 512, 512]
    residual_style: True
    cond_dim: ${eval:'${obs_dim} * ${cond_steps}'}
    horizon_steps: ${horizon_steps}
    action_dim: ${action_dim}
  critic_q:
    _target_: model.common.critic.CriticObsAct
    action_dim: ${action_dim}
    action_steps: ${act_steps}
    cond_dim: ${eval:'${obs_dim} * ${cond_steps}'}
    mlp_dims: [256, 256, 256]
    activation_type: Mish
    residual_style: True
  critic_v:
    _target_: model.common.critic.CriticObs
    cond_dim: ${eval:'${obs_dim} * ${cond_steps}'}
    mlp_dims: [256, 256, 256]
    activation_type: Mish
    residual_style: True
  horizon_steps: ${horizon_steps}
  obs_dim: ${obs_dim}
  action_dim: ${action_dim}
  denoising_steps: ${denoising_steps}
  device: ${device}
